# Bootloader-Einstellungen (Limine). Bewusst nur ASCII in dieser Datei.
# 0 Sekunden warten: VibanOS startet sofort, ohne Auswahlmenue.
timeout: 0

/VibanOS
    protocol: limine

    # boot():/ ist der Datentraeger, auf dem diese Datei liegt. Die .elf-Datei heisst wie das Projekt.
    path: boot():/boot/VibanOS.elf

    # Wunschaufloesung der Oberflaeche (siehe Designsheet). Kann die Grafikkarte sie nicht,
    # nimmt Limine eine andere, und VibanOS richtet sich nach der tatsaechlichen Groesse.
    resolution: 1280x720x32
